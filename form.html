<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить заявку | Очаг</title>
    <style>
        :root {
            --primary: #000000;
            --accent: #c0392b;
            --bg-light: #f9f9f9;
            --text-dark: #333;
            --text-gray: #666;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            line-height: 1.6;
            background-color: var(--bg-light);
        }

        header {
            background-color: #fff;
            height: 80px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0 15px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea{
            resize: none;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo img {
            height: 150px;
            width: 180px
        }

        .logo span {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
        }

        nav a:hover {
            color: var(--accent);
        }

        .form-container {
            max-width: 600px;
            margin: 60px auto;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.8rem;
            margin-top: 0;
        }

        .form-note {
            text-align: center;
            color: var(--text-gray);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button.btn-submit {
            background-color: var(--primary);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background 0.3s;
        }

        button.btn-submit:hover {
            background-color: var(--accent);
        }

        button.btn-submit:disabled {
  background-color: #777171 !important;
  color: #ffffff !important;
  cursor: not-allowed;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
            margin: 4px 0 0;
        }

        .checkbox-group label {
            font-weight: normal;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .success-message {
            text-align: center;
        }

        .success-message h2 {
            color: var(--primary);
        }

        .back-link {
            color: var(--accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">
                <img src="ochag.png" alt="Логотип Очаг" onerror="this.style.display='none'">
            </div>
            <nav>
                <a href="index.html">← На главную</a>
            </nav>
        </div>
    </header>

    <div class="form-container">
        <form id="orderForm" action="https://ochag.de2.netrun.io" method="POST" onsubmit="return handleSubmit(event)">
            <h1>Оставить заявку</h1>
            <p class="form-note">Мы свяжемся с вами в течение 1 рабочего дня</p>

            <div class="form-group">
                <label for="fullName">ФИО</label>
                <input type="text" id="fullName" name="name" required placeholder="Иванов Иван Иванович" oninput="checkForm()">
            </div>

            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" name="phone" required placeholder="+7 (___) ___-__-__" oninput="checkForm()">
            </div>
            
            <div class="form-group">
                <label for="email">Почта</label>
                <input type="text" id="email" name="email" required placeholder="Ivan@mail.com" oninput="checkForm()">
            </div> 

            <div class="form-group">
                <label for="comment">Комментарий (необязательно)</label>
                <textarea id="comment" name="comment" rows="4" placeholder="Тип изделия, материалы, сроки, особые пожелания"></textarea>
            </div>
               
            <div class="form-group checkbox-group">
                <input type="checkbox" id="agree" required oninput="checkForm()">
                <label for="agree">Нажимая кнопку «Отправить», вы соглашаетесь на обработку персональных данных.</label>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn" disabled>Отправить заявку</button>

        </form>

        <div id="successBlock" style="display:none;" class="success-message">
            <h2>Спасибо! Ваша заявка принята.</h2>
            <p>Мы свяжемся с вами в течение 1 рабочего дня для уточнения деталей.</p>
        </div>
    </div>

    <script>
    function handleSubmit(event) {
        event.preventDefault();
        const form = document.getElementById('orderForm');

        // Отправляем данные на сервер в фоне и не ждём Макс
        fetch(form.action, {
            method: 'POST',
            body: new FormData(form)
        }).catch(() => {}); // даже если сервер не ответил — блок всё равно покажем

        // Сразу заменяем форму на блок успеха
        document.getElementById('orderForm').style.display = 'none';
        document.getElementById('successBlock').style.display = 'block';
    }

    // НОВАЯ ФУНКЦИЯ: следит за заполнением полей
    function checkForm() {
        const name = document.querySelector('[name="name"]');
        const phone = document.querySelector('[name="phone"]');
        const email = document.querySelector('[name="email"]');
        const agree = document.getElementById('agree');
        const btn = document.getElementById('submitBtn');

        btn.disabled = !(
            name.value.trim() !== '' &&
            phone.value.trim() !== '' &&
            email.value.trim() !== '' &&
            agree.checked
        );
    }
</script>
</body>
</html>
